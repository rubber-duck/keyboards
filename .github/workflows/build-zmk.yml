name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: zmk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated keymaps
        run: python generate.py all --check
      - name: Test layout checks
        run: python -m unittest discover -s tests

  build:
    needs: validate
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: totem/build.yaml
      config_path: totem/config
      archive_name: totem-firmware
