name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: zmk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated keymaps
        run: python generate.py all --check
      - name: Test layout checks
        run: python -m unittest discover -s tests
      # The upstream reusable workflow assumes the config's parent is the repo
      # root. Use our isolated workspace for the nested totem/config directory.
      - name: Build both Totem halves
        run: bash totem/scripts/build-local.sh
      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: totem-firmware
          if-no-files-found: error
          path: totem/firmware/*.uf2
